<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKLCH picker harness</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0c10; color: #eee; font-family: system-ui, sans-serif; }
      /* Mirrors the settings modal: max-w-3xl container, pickers stacked. */
      .wrap {
        max-width: 768px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .swatch { grid-column: 1 / -1; padding: 14px; border-radius: 10px; font-size: 13px; }
      .swatch .mono { font-family: ui-monospace, monospace; opacity: 0.75; }
      .ladder { grid-column: 1 / -1; display: grid; gap: 6px; }
      .ladder-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 10px; border-radius: 6px; font-size: 12px;
      }
      .ladder-row .mono { font-family: ui-monospace, monospace; }
      .note { grid-column: 1 / -1; font-size: 12px; color: #fcd34dc0; }
      .pairs { grid-column: 1 / -1; display: grid; gap: 8px; }
      .pair-strip { display: flex; border-radius: 6px; overflow: hidden; }
      .pair-strip .half {
        flex: 1; padding: 8px 10px; font-size: 11px; font-family: ui-monospace, monospace;
      }
      .pair-meta { font-size: 11px; color: #ffffff8c; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/oklch-harness.tsx"></script>
  </body>
</html>
